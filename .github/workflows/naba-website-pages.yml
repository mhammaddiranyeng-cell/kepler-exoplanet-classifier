# Builds the NABA NGO website and publishes it to GitHub Pages.
#
# This is a PREVIEW deploy so the site can be reviewed at a URL before it goes
# live on naba.ngo. GitHub serves project sites from a sub-path
# (https://<user>.github.io/<repo>/), so the build is told where it is mounted
# via BASE_PATH, and asked to emit noindex + a disallow-all robots.txt so this
# copy can never compete with the real domain in search results.
#
# No manual setup needed: configure-pages runs with enablement, so the first
# run turns Pages on and points it at Actions by itself. Every push that
# touches naba-website/ redeploys automatically after that.
#
# If enablement is ever refused (some org policies block it), turn it on by
# hand instead: Settings > Pages > Build and deployment > Source > "GitHub
# Actions", then re-run this workflow.

name: Deploy NABA website to GitHub Pages

on:
  push:
    branches:
      - claude/naba-ngo-website-as2968
    paths:
      - "naba-website/**"
      - ".github/workflows/naba-website-pages.yml"
  # Lets you redeploy by hand from the Actions tab without pushing anything.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: naba-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No dependencies to install — the build uses Node builtins only.
      - name: Build site
        working-directory: naba-website
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
          NOINDEX: "1"
        run: node build.mjs

      - uses: actions/configure-pages@v5
        with:
          # Enable Pages on first run rather than requiring a manual visit to
          # repository settings.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: naba-website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
