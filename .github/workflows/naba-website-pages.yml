# Builds the NABA NGO website and publishes it to GitHub Pages.
#
# This is a PREVIEW deploy so the site can be reviewed at a URL before it goes
# live on naba.ngo. GitHub serves project sites from a sub-path
# (https://<user>.github.io/<repo>/), so the build is told where it is mounted
# via BASE_PATH, and asked to emit noindex + a disallow-all robots.txt so this
# copy can never compete with the real domain in search results.
#
# DISABLED ON PURPOSE — DO NOT ADD A push: TRIGGER TO THIS FILE.
#
# A repository has exactly one GitHub Pages site. This repository's Pages URL
# already serves the owner's portfolio, so deploying the NABA website from here
# would REPLACE it. The workflow is therefore manual-only: it cannot fire by
# itself, and running it is an explicit, deliberate act.
#
# The NABA site should get its own repository, which gives it its own Pages URL
# with nothing to overwrite. Once that exists, move this workflow there and the
# push: trigger below can be restored safely.

name: Deploy NABA website to GitHub Pages

on:
  # Manual only. See the warning above before adding any automatic trigger.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: naba-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No dependencies to install — the build uses Node builtins only.
      - name: Build site
        working-directory: naba-website
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
          NOINDEX: "1"
        run: node build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: naba-website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
